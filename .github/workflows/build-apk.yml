# Build a signed release APK in the cloud via GitHub Actions.
# Trigger: push a tag like "v1.0.0", or run manually from the Actions tab
# (Workflow dispatch). The APK is uploaded as a build artifact you can download.
#
# Why cloud build: Android Studio is heavy (~10GB, slow on weak laptops). This
# workflow builds on GitHub's runners — your laptop only downloads the final
# ~5MB APK. The APK is signed with a release keystore stored as a repo secret,
# so Play Protect trusts it (no more "package appears invalid").

name: Build Android APK

on:
  workflow_dispatch: # manual trigger from Actions tab
  push:
    tags:
      - 'v*' # triggers on any tag like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install root deps (Capacitor CLI)
        run: npm install

      - name: Install client deps
        run: npm install
        working-directory: client

      - name: Build web + sync to Android
        env:
          VITE_API_URL_MOBILE: 'https://backend-production-48d99.up.railway.app'
        run: node scripts/build-mobile.mjs

      - name: Inject release signing config into Gradle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          # Add a signingConfigs block reading from -P / ORG_GRADLE_PROJECT_ props,
          # and reference it from the release build type.
          inject = """
          def signKeystore = project.findProperty('vibroSignKeystore')
          android.signingConfigs.create('release') {
              if (signKeystore != null && file(signKeystore).exists()) {
                  storeFile file(signKeystore)
                  storePassword project.findProperty('vibroSignStorePassword')
                  keyAlias project.findProperty('vibroSignKeyAlias')
                  keyPassword project.findProperty('vibroSignKeyPassword')
              }
          }
          """
          t = t.replace("android {\n    namespace", inject + "android {\n    namespace", 1)
          t = t.replace(
              "        release {\n            minifyEnabled false",
              "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
              1,
          )
          p.write_text(t)
          print('Patched build.gradle with release signing config')
          PY

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "Keystore decoded."

      - name: Build SIGNED release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_vibroSignKeystore: app/release.keystore
          ORG_GRADLE_PROJECT_vibroSignStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_vibroSignKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_vibroSignKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build DEBUG APK (no keystore configured)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        working-directory: android
        run: |
          APK=$(find . -name "*.apk" -path "*build/outputs*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibroscan-ai-apk
          path: android/${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
